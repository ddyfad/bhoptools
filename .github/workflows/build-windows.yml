name: Build (Windows x64, Linux x64)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.3); leave empty to only build"
        required: false
        default: ""
      notes:
        description: "Release notes, shown in the update popup"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        required: false
        default: false
      required_update:
        description: "Required update: installed for everyone, even those who chose never to update (for fixes that can't wait, like signatures a game update broke)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        run: echo '#define APP_VERSION "${{ inputs.release_tag }}"' > client/shared/version.h

      - name: Build Release x64
        run: msbuild client/bhoptools.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: bhoptools-x64
          path: |
            client/x64/Release/*.exe
            client/x64/Release/*.pdb
            client/windows/x64/Release/*.exe
            client/windows/x64/Release/*.pdb
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: echo '#define APP_VERSION "${{ inputs.release_tag }}"' > client/shared/version.h

      - name: Build
        run: make -C client/linux

      - name: Check glibc
        run: make -C client/linux check-glibc

      - uses: actions/upload-artifact@v4
        with:
          name: bhoptools-linux-x64
          path: |
            client/linux/bhoptools.so
            client/linux/bhoptools
          if-no-files-found: error

  build-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: echo '#define BHOPTOOLS_VERSION "${{ inputs.release_tag }}"' > plugin/addons/sourcemod/scripting/bhoptools/version.sp

      - name: Compile
        run: |
          set -e
          curl -fsSL https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7253-linux.tar.gz | tar xz
          SM=$PWD/addons/sourcemod/scripting
          mkdir out
          (cd plugin/addons/sourcemod/scripting && $SM/spcomp64 bhoptools.sp -i$SM/include -iinclude -o$GITHUB_WORKSPACE/out/bhoptools.smx)
          printf '{"version":"%s","size":%s,"sha256":"%s"}' "${{ inputs.release_tag }}" "$(stat -c %s out/bhoptools.smx)" "$(sha256sum out/bhoptools.smx | cut -d' ' -f1)" > out/manifest.json
          cat out/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: bhoptools-plugin
          path: out/*
          if-no-files-found: error

  # Run the workflow by hand with a release_tag to publish the builds as one release.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build, build-linux, build-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bhoptools-x64
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: bhoptools-linux-x64
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: bhoptools-plugin
          path: dist/plugin

      # Artifacts lose the executable bit; the tarball keeps it.
      - name: Package
        run: |
          set -e
          cp "$(find dist/windows -name bhoptools.exe | head -1)" bhoptools.exe
          mkdir bhoptools-linux
          cp dist/linux/bhoptools.so dist/linux/bhoptools bhoptools-linux/
          chmod +x bhoptools-linux/bhoptools
          tar czf bhoptools-linux.tar.gz bhoptools-linux
          cp bhoptools-linux/* .
          cp dist/plugin/bhoptools.smx dist/plugin/manifest.json .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            bhoptools.exe
            bhoptools-linux.tar.gz
            bhoptools.so
            bhoptools
            bhoptools.smx
            manifest.json
          body: |
            ${{ inputs.required_update && '[required]' || '' }}
            ${{ inputs.notes }}

            ---

            Windows:
            - Download `bhoptools.exe` and run it, it starts CS:S with `-insecure`.

            Linux (64-bit CS:S):
            - Download `bhoptools-linux.tar.gz` (or `bhoptools.so` and `bhoptools`) and extract it somewhere without spaces or `:` in the path.
            - Run `./bhoptools` (`chmod +x` it first if you downloaded it on its own), and paste the launch options it prints into Steam.

            Server:
            - Put `bhoptools.smx` in `addons/sourcemod/plugins/`. It keeps itself up to date from these releases (needs the ripext extension); `sm_bhoptools_autoupdate 0` turns that off.

            Both:
            - Everything is switched on and off in Options → `Fixes`.
            - `F5` autohop prediction (Windows), `F7` viewpunch remover, `F8` pingfix (client-side prediction of triggers, rngfix and the HUD speed).
            - On servers running the [bhoptools plugin](https://github.com/ddyfad/bhoptools): checkpoints, noclip, restarts, shavit runspeed, landfix, easybhop, style key blocking, shavit-syncstyle autosync and momsurffix2 predicted, mpbhops_but_working doors, and the map state synced from the server.
