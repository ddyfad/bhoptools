name: Build (Windows x64, Linux x64)

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "What to publish: client (the exe and the Linux build), plugin (the SourceMod plugin) or both"
        type: choice
        options:
          - client
          - plugin
          - both
        default: client
      release_tag:
        description: "Client version to publish (e.g. 1.3). Leave empty to only build, or when publishing only the plugin"
        required: false
        default: ""
      plugin_version:
        description: "Plugin version to publish (e.g. 7). Leave empty to use the client version when publishing both"
        required: false
        default: ""
      notes:
        description: "Client release notes, shown in the update popup"
        required: false
        default: ""
      prerelease:
        description: "Mark the client release as a pre-release"
        type: boolean
        required: false
        default: false
      required_update:
        description: "Required client update: installed for everyone, even those who chose never to update (for fixes that can't wait, like signatures a game update broke)"
        type: boolean
        required: false
        default: false

env:
  SM_URL: https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0-git7253-linux.tar.gz
  SM_SHA256: 6bbcab989cda0ada83600d0dcb0f46affd16529b2b02ed2dba1b5baeaf02fdb4

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.target != 'plugin'
        shell: bash
        run: echo '#define APP_VERSION "${{ inputs.release_tag }}"' > client/shared/version.h

      - name: Build Release x64
        run: msbuild client/bhoptools.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bhoptools-x64
          path: |
            client/x64/Release/*.exe
            client/x64/Release/*.pdb
            client/windows/x64/Release/*.exe
            client/windows/x64/Release/*.pdb
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set version
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.target != 'plugin'
        run: echo '#define APP_VERSION "${{ inputs.release_tag }}"' > client/shared/version.h

      - name: Build
        run: make -C client/linux

      - name: Check glibc
        run: make -C client/linux check-glibc

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bhoptools-linux-x64
          path: |
            client/linux/bhoptools.so
            client/linux/bhoptools
          if-no-files-found: error

  build-plugin:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Work out the plugin version
        id: version
        run: |
          set -e
          V=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.target }}" != "client" ]; then
            V="${{ inputs.plugin_version }}"
            if [ -z "$V" ] && [ "${{ inputs.target }}" = "both" ]; then V="${{ inputs.release_tag }}"; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "$V" ]; then echo "#define BHOPTOOLS_VERSION \"$V\"" > plugin/addons/sourcemod/scripting/bhoptools/version.sp; fi

      - name: Compile
        run: |
          set -e
          curl -fsSL "$SM_URL" -o sm.tar.gz
          echo "$SM_SHA256  sm.tar.gz" | sha256sum -c -
          tar xzf sm.tar.gz
          rm sm.tar.gz
          SM=$PWD/addons/sourcemod/scripting
          mkdir out
          (cd plugin/addons/sourcemod/scripting && $SM/spcomp64 bhoptools.sp -i$SM/include -iinclude -o$GITHUB_WORKSPACE/out/bhoptools.smx)
          V="${{ steps.version.outputs.version }}"
          if [ -n "$V" ]; then
            cp out/bhoptools.smx "out/bhoptools-$V.smx"
            printf '{"version":"%s","size":%s,"sha256":"%s"}' "$V" "$(stat -c %s out/bhoptools.smx)" "$(sha256sum out/bhoptools.smx | cut -d' ' -f1)" > out/manifest.json
            cat out/manifest.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bhoptools-plugin
          path: out/*
          if-no-files-found: error

  # Run the workflow by hand with target client (or both) and a release_tag to publish the client.
  release-client:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.target != 'plugin'
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bhoptools-x64
          path: dist/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bhoptools-linux-x64
          path: dist/linux

      # Artifacts lose the executable bit; the tarball keeps it.
      - name: Package
        run: |
          set -e
          cp "$(find dist/windows -name bhoptools.exe | head -1)" bhoptools.exe
          mkdir bhoptools-linux
          cp dist/linux/bhoptools.so dist/linux/bhoptools bhoptools-linux/
          chmod +x bhoptools-linux/bhoptools
          tar czf bhoptools-linux.tar.gz bhoptools-linux
          cp bhoptools-linux/* .

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            bhoptools.exe
            bhoptools-linux.tar.gz
            bhoptools.so
            bhoptools
          body: |
            ${{ inputs.required_update && '[required]' || '' }}
            ${{ inputs.notes }}

            ---

            Windows:
            - Download `bhoptools.exe` and run it, it starts CS:S with `-insecure`.

            Linux (64-bit CS:S):
            - Download `bhoptools-linux.tar.gz` (or `bhoptools.so` and `bhoptools`) and extract it somewhere without spaces or `:` in the path.
            - Run `./bhoptools` (`chmod +x` it first if you downloaded it on its own), and paste the launch options it prints into Steam.

            Server plugin:
            - Get `bhoptools.smx` from the [plugin release](https://github.com/ddyfad/bhoptools/releases/tag/plugin). It keeps itself up to date from there.

            Both:
            - Everything is switched on and off in Options → `Fixes`.
            - `F5` autohop prediction (Windows), `F7` viewpunch remover, `F8` pingfix (client-side prediction of triggers, rngfix and the HUD speed).
            - On servers running the [bhoptools plugin](https://github.com/ddyfad/bhoptools): checkpoints, noclip, restarts, shavit runspeed, landfix, easybhop, style key blocking, shavit-syncstyle autosync and momsurffix2 predicted, mpbhops_but_working doors, and the map state synced from the server.

  # Run the workflow by hand with target plugin (or both) to publish the plugin. It goes to a single
  # pre-release tagged "plugin", which the client's updater ignores; the plugin reads manifest.json from it.
  release-plugin:
    if: github.event_name == 'workflow_dispatch' && needs.build-plugin.outputs.version != ''
    needs: [build-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bhoptools-plugin
          path: dist/plugin

      - name: Package
        run: |
          set -e
          cp dist/plugin/bhoptools.smx dist/plugin/manifest.json "dist/plugin/bhoptools-${{ needs.build-plugin.outputs.version }}.smx" .

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: plugin
          target_commitish: ${{ github.sha }}
          name: plugin
          prerelease: true
          make_latest: false
          files: |
            bhoptools.smx
            bhoptools-${{ needs.build-plugin.outputs.version }}.smx
            manifest.json
          body: |
            The SourceMod plugin, currently version ${{ needs.build-plugin.outputs.version }}.

            - First install: put `bhoptools.smx` in `addons/sourcemod/plugins/`. After that it updates itself from this release (needs the ripext extension).
            - `sm_bhoptools_autoupdate 0` turns that off, `sm_bhoptools_checkupdate` checks now.
            - This is a pre-release on purpose, so the client's updater ignores it.
