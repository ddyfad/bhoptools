name: Staging (dev builds, promote)

# Only for ddyfad/bhoptools-staging; see STAGING.md. Promote pushes this file to the public repo
# along with everything else, so every job checks the repository first.
#
# Push: builds bhoptools-dev and the public variant. Pushes to main publish them
# as the pre-release dev-<run number>, which bhoptools-dev updates from.
# Run by hand (promote), in two steps:
#   1. dev_tag and version, no sums_signature: rebuilds the public variant from the dev build's
#      commit with only version.h changed, and keeps the files and their SHA256SUMS as the
#      "release" artifact. Nothing goes public.
#   2. build_run (step 1's run id) and sums_signature (SHA256SUMS signed with the release key):
#      checks the signature, pushes the commit to the public main branch and publishes
#      step 1's files, SHA256SUMS and SHA256SUMS.sig as a public release.

on:
  push:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: "Step 1: dev build to promote (e.g. dev-48)"
        required: false
        default: ""
      version:
        description: "Step 1: public version to publish it as (e.g. 1.13)"
        required: false
        default: ""
      notes:
        description: "Step 1: release notes, shown in the update popup"
        required: false
        default: ""
      required_update:
        description: "Step 1: required update, installed for everyone, even those who chose never to update"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Step 1: mark the public release as a pre-release"
        type: boolean
        required: false
        default: false
      build_run:
        description: "Step 2: id of the step 1 run to publish"
        required: false
        default: ""
      sums_signature:
        description: "Step 2: contents of SHA256SUMS.sig (gh workflow run -F sums_signature=@SHA256SUMS.sig)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'ddyfad/bhoptools-staging'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      version: ${{ steps.prepare.outputs.version }}
      variants: ${{ steps.prepare.outputs.variants }}
      # push, build (promote step 1) or publish (step 2)
      mode: ${{ steps.prepare.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'workflow_dispatch' && inputs.sums_signature == ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out what to build
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          DEV_TAG: ${{ inputs.dev_tag }}
          VERSION: ${{ inputs.version }}
          BUILD_RUN: ${{ inputs.build_run }}
          HAVE_SIGNATURE: ${{ inputs.sums_signature != '' }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "version=dev-$GITHUB_RUN_NUMBER (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo 'variants=["public","dev"]' >> "$GITHUB_OUTPUT"
            echo "mode=push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -n "$GH_TOKEN" ] || { echo "::error::the PUBLIC_REPO_TOKEN secret isn't set (STAGING.md)"; exit 1; }
          if [ "$HAVE_SIGNATURE" = true ]; then
            [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || { echo "::error::with sums_signature, build_run should be the id of the step 1 run"; exit 1; }
            # The publish job does the rest; no builds.
            echo 'variants=["public"]' >> "$GITHUB_OUTPUT"
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -z "$BUILD_RUN" ] || { echo "::error::build_run is for step 2, with sums_signature"; exit 1; }

          [[ "$DEV_TAG" =~ ^dev-[0-9]+$ ]] || { echo "::error::dev_tag should look like dev-48"; exit 1; }
          # "dev" switches the update check off and dev-<n> is the dev client's.
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ && "$VERSION" != dev* ]] || { echo "::error::version should look like 1.13"; exit 1; }
          sha=$(git rev-parse -q --verify "refs/tags/$DEV_TAG^{commit}") || { echo "::error::no tag $DEV_TAG in this repo"; exit 1; }
          if gh release view "$VERSION" -R ddyfad/bhoptools >/dev/null 2>&1; then
            echo "::error::ddyfad/bhoptools already has a release $VERSION"
            exit 1
          fi
          # Fast-forward only: the public branch must already be part of the dev build's history.
          if git fetch -q https://github.com/ddyfad/bhoptools.git main; then
            if ! git merge-base --is-ancestor FETCH_HEAD "$sha"; then
              echo "::error::public main ($(git rev-parse --short FETCH_HEAD)) has commits that $DEV_TAG ($sha) doesn't. Merge it into staging, push, and promote the dev build that makes."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo 'variants=["public"]' >> "$GITHUB_OUTPUT"
          echo "mode=build" >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.mode != 'publish'
    needs: prepare
    runs-on: windows-2022
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    env:
      NAME: ${{ matrix.variant == 'dev' && 'bhoptools-dev' || 'bhoptools' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Set version
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "#define APP_VERSION \"$APP_VERSION\"" > client/shared/version.h

      - name: Build Release x64
        shell: pwsh
        run: |
          if ('${{ matrix.variant }}' -eq 'dev') {
            # cl.exe takes extra options from CL.
            $env:CL = '/DBHOPTOOLS_DEV'
            Copy-Item client/windows/bhoptools-dev.ico client/windows/bhoptools.ico -Force
          }
          msbuild client/bhoptools.sln /p:Configuration=Release /p:Platform=x64 /p:TargetName=$env:NAME /m /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-${{ matrix.variant }}
          path: |
            client/x64/Release/${{ env.NAME }}.exe
            client/x64/Release/${{ env.NAME }}.pdb
            client/windows/x64/Release/${{ env.NAME }}.exe
            client/windows/x64/Release/${{ env.NAME }}.pdb
          if-no-files-found: error

  build-linux:
    if: needs.prepare.outputs.mode != 'publish'
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    env:
      NAME: ${{ matrix.variant == 'dev' && 'bhoptools-dev' || 'bhoptools' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set version
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "#define APP_VERSION \"$APP_VERSION\"" > client/shared/version.h

      - name: Build
        run: |
          if [ "${{ matrix.variant }}" = dev ]; then
            make -C client/linux CXX="g++ -DBHOPTOOLS_DEV" SO_NAME=bhoptools-dev.so EXE_NAME=bhoptools-dev all check-glibc
          else
            make -C client/linux all check-glibc
          fi

      - name: Release signature tests
        run: make -C client/tests release_sig_test && client/tests/release_sig_test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.variant }}
          path: |
            client/linux/${{ env.NAME }}.so
            client/linux/${{ env.NAME }}
          if-no-files-found: error

  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, so each one's notes start from the release before it.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: dev-${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      # Artifacts lose the executable bit; the tarball keeps it.
      - name: Package
        run: |
          set -e
          mkdir out pkg
          # $1 variant, $2 file name, $3 asset prefix
          package() {
            cp "$(find dist/win-$1 -name "$2.exe" | head -1)" "out/$3$2.exe"
            mkdir "pkg/$2-linux"
            cp "dist/linux-$1/$2.so" "dist/linux-$1/$2" "pkg/$2-linux/"
            chmod +x "pkg/$2-linux/$2"
            tar czf "out/$3$2-linux.tar.gz" -C pkg "$2-linux"
            cp "pkg/$2-linux/$2.so" "out/$3$2.so"
            cp "pkg/$2-linux/$2" "out/$3$2"
          }
          package dev bhoptools-dev ""
          package public bhoptools public-
          ls -l out

      - name: Notes
        run: |
          set -e
          # Not this run's own tag, which a re-run finds.
          prev=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^dev-[0-9]+$' | grep -vx "$TAG" | sort -t- -k2,2 -rn | head -1 || true)
          {
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA" | head -50
            else
              git log --no-merges --format='- %s' -10 "$GITHUB_SHA"
            fi
            echo
            echo "$GITHUB_REF_NAME ${GITHUB_SHA::7}"
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --yes --cleanup-tag; fi
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --prerelease --latest=false

      - name: Keep the newest 30
        run: |
          set -e
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^dev-[0-9]+$' | sort -t- -k2,2 -rn | tail -n +31 | while read -r old; do
            echo "deleting $old"
            gh release delete "$old" --yes --cleanup-tag
          done

  # Promote step 1: builds, writes SHA256SUMS and keeps everything as the "release" artifact.
  promote:
    if: needs.prepare.outputs.mode == 'build'
    needs: [prepare, build, build-linux]
    runs-on: ubuntu-24.04
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      DEV_TAG: ${{ inputs.dev_tag }}
      NOTES: ${{ inputs.notes }}
      REQUIRED: ${{ inputs.required_update }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win-public
          path: dist/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-public
          path: dist/linux

      # Artifacts lose the executable bit; the tarball keeps it.
      - name: Package
        run: |
          set -e
          mkdir -p release/out
          cp "$(find dist/windows -name bhoptools.exe | head -1)" release/out/bhoptools.exe
          mkdir bhoptools-linux
          cp dist/linux/bhoptools.so dist/linux/bhoptools bhoptools-linux/
          chmod +x bhoptools-linux/bhoptools
          tar czf release/out/bhoptools-linux.tar.gz bhoptools-linux
          cp bhoptools-linux/* release/out/
          # What gets signed. The first line ties it to this version (the client checks it against
          # the tag), so it can't be put on another release.
          (cd release/out && { echo "# bhoptools release $VERSION"; sha256sum bhoptools.exe bhoptools-linux.tar.gz bhoptools.so bhoptools; } > SHA256SUMS)
          cat release/out/SHA256SUMS
          jq -n --arg sha "$SHA" --arg version "$VERSION" --arg dev_tag "$DEV_TAG" --argjson prerelease "$PRERELEASE" \
            '{sha: $sha, version: $version, dev_tag: $dev_tag, prerelease: $prerelease}' > release/meta.json

      # The same body as build-windows.yml's release: the client shows what's above the ---.
      - name: Release notes
        run: |
          set -e
          {
            if [ "$REQUIRED" = true ]; then echo '[required]'; else echo; fi
            printf '%s\n' "$NOTES"
            cat <<'EOF'

          ---

          Windows:
          - Download `bhoptools.exe` and run it, it starts CS:S with `-insecure`.

          Linux (64-bit CS:S):
          - Download `bhoptools-linux.tar.gz` (or `bhoptools.so` and `bhoptools`) and extract it somewhere without spaces or `:` in the path.
          - Run `./bhoptools` (`chmod +x` it first if you downloaded it on its own), and paste the launch options it prints into Steam.

          Server plugin:
          - Get `bhoptools.smx` from the [plugin release](https://github.com/ddyfad/bhoptools/releases/tag/plugin). It keeps itself up to date from there.

          Both:
          - Everything is switched on and off in Options → `Fixes`.
          - `F5` autohop prediction (Windows), `F7` viewpunch remover, `F8` pingfix (client-side prediction of triggers, rngfix and the HUD speed).
          - On servers running the [bhoptools plugin](https://github.com/ddyfad/bhoptools): checkpoints, noclip, restarts, shavit runspeed, landfix, easybhop, style key blocking, shavit-syncstyle autosync and momsurffix2 predicted, mpbhops_but_working doors, and the map state synced from the server.

          `SHA256SUMS` lists every file, and `SHA256SUMS.sig` is its signature by a bhoptools release key (the keys are in `.github/release_signers`; check with `ssh-keygen -Y verify`).
          EOF
            echo
            echo "Built from ${SHA}, tested as ${DEV_TAG}."
          } > release/body.md
          cat release/body.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release
          if-no-files-found: error

      - name: What to do next
        run: |
          d="%USERPROFILE%\\bhoptools-release\\$VERSION"
          {
            echo "## $VERSION is built, not published"
            echo
            echo "Sign SHA256SUMS with the release key and run step 2 (STAGING.md, Promoting), in cmd.exe:"
            echo
            echo '```'
            echo "gh run download $GITHUB_RUN_ID -R $GITHUB_REPOSITORY -n release -D $d"
            echo "type $d\\out\\SHA256SUMS"
            echo "ssh-keygen -Y sign -n bhoptools-release -f %USERPROFILE%\\.ssh\\bhoptools-release $d\\out\\SHA256SUMS"
            echo "gh workflow run staging.yml -R $GITHUB_REPOSITORY --ref $GITHUB_REF_NAME -f build_run=$GITHUB_RUN_ID -F sums_signature=@$d\\out\\SHA256SUMS.sig"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Promote step 2: checks the signature, then pushes and publishes what step 1 built.
  publish:
    if: needs.prepare.outputs.mode == 'publish'
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    steps:
      # Outside the workspace, which the checkout below cleans.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}

      - name: Read what step 1 built
        id: meta
        env:
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          set -e
          sha=$(jq -r .sha "$RUNNER_TEMP/release/meta.json")
          version=$(jq -r .version "$RUNNER_TEMP/release/meta.json")
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$version" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::run $BUILD_RUN's meta.json is broken"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Without persisted credentials, so the push below uses the public repo's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.meta.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Before anything goes public. The keys are the ones the commit being released pins.
      - name: Check the signature
        env:
          SUMS_SIGNATURE: ${{ inputs.sums_signature }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash .github/check-release.sh "$RUNNER_TEMP/release/out" "$VERSION"

      - name: Push to the public main branch
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$VERSION" -R ddyfad/bhoptools >/dev/null 2>&1; then
            echo "::error::ddyfad/bhoptools already has a release $VERSION"
            exit 1
          fi
          git remote add public "https://x-access-token:${GH_TOKEN}@github.com/ddyfad/bhoptools.git"
          if ! git push public "$SHA:refs/heads/main"; then
            echo "::error::couldn't push $SHA to public main: it moved since the check (not a fast-forward any more), or PUBLIC_REPO_TOKEN lacks Contents or Workflows write"
            exit 1
          fi

      - name: Publish
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -e
          pre=""
          if [ "$(jq -r .prerelease "$RUNNER_TEMP/release/meta.json")" = true ]; then pre="--prerelease"; fi
          cd "$RUNNER_TEMP/release/out"
          gh release create "$VERSION" -R ddyfad/bhoptools --target "$SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/release/body.md" $pre \
            bhoptools.exe bhoptools-linux.tar.gz bhoptools.so bhoptools SHA256SUMS SHA256SUMS.sig
